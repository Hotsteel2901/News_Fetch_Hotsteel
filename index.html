<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="每日新闻速览：自动抓取中英文 RSS 新闻源，聚合阅读，每日更新。">
<title>每日新闻速览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23bfe7ff'/><stop offset='1' stop-color='%232f8ec6'/></linearGradient><linearGradient id='c' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffffff'/><stop offset='1' stop-color='%23bfe9ff'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23a)'/><rect x='4' y='4' width='56' height='28' rx='12' fill='%23fff' opacity='.28'/><circle cx='32' cy='36' r='18' fill='url(%23c)' opacity='.92'/><circle cx='26' cy='30' r='5' fill='%23fff'/><path d='M18 44a14 14 0 0 0 28 0z' fill='%2364c98c' opacity='.75'/></svg>">
<script>
(function () {
  try {
    var saved = localStorage.getItem('daily-news-theme');
    if (saved !== 'light' && saved !== 'dark') {
      saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = saved;
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   每日速览 — Frutiger Aero 皮肤 · v2
   v2 优化：阅读体验（字号调节 / 已读标记 / 阅读时长 / 回顶 / J·K 快捷键）
           性能（合成层动画、去卡片 backdrop-filter、rAF 滚动节流、移动端减负）
           动效与丝滑感全部保留
   ═══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Tokens — 白昼 Aero（含完整背景栈：射线+云+天空+草地） ─── */
:root {
  color-scheme: light;
  --paper: #cdecff;
  --bg-grad:
    linear-gradient(104deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 24%),
    linear-gradient(97deg, rgba(255,255,255,.32) 4%, rgba(255,255,255,0) 32%),
    radial-gradient(42% 24% at 16% 12%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%),
    radial-gradient(50% 28% at 82% 26%, rgba(255,255,255,.6), rgba(255,255,255,0) 72%),
    radial-gradient(36% 22% at 46% 60%, rgba(255,255,255,.5), rgba(255,255,255,0) 74%),
    radial-gradient(120% 70% at 50% -18%, rgba(255,255,255,.95), rgba(255,255,255,0) 55%),
    radial-gradient(80% 50% at 88% -6%, rgba(255,243,185,.75), rgba(255,243,185,0) 60%),
    radial-gradient(130% 62% at 50% 120%, rgba(122,214,150,.92), rgba(122,214,150,0) 64%),
    linear-gradient(180deg, #f4fbff 0%, #cdecff 34%, #a4dcf8 58%, #b8e9c4 78%, #a9e2b6 100%);
  --surface: rgba(255, 255, 255, .62);
  --surface-solid: #ffffff;
  --glass: linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.68));
  --glass-deep: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.38));
  --ink: #0c3a57;
  --ink-2: #34637f;
  --muted: #648ea8;
  --line: rgba(255,255,255,.78);
  --line-2: rgba(120,190,235,.6);
  --accent: #1f8fd0;
  --accent-2: #67c6ee;
  --accent-soft: rgba(90,190,240,.18);
  --ring: rgba(80,180,235,.55);
  --topbar: rgba(255,255,255,.55);
  --sk-a: rgba(255,255,255,.5);
  --sk-b: rgba(210,238,255,.75);
  --candy: linear-gradient(180deg, #8fd4f6, #38a4dd 55%, #2b8ec6);
  --candy-text: #ffffff;
  --shadow-1: 0 12px 26px -14px rgba(25,100,150,.5);
  --shadow-2: 0 22px 48px -22px rgba(20,90,140,.52);
  --glass-hi: rgba(255,255,255,.95);
  --well: rgba(255,255,255,.58);
  --reading-scale: 1;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.4, .44, 1);
}

/* ─── Tokens — 暮色 Aero ─── */
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0a2334;
  --bg-grad:
    linear-gradient(104deg, rgba(140,215,255,.16) 0%, rgba(140,215,255,0) 26%),
    linear-gradient(97deg, rgba(160,225,255,.09) 4%, rgba(160,225,255,0) 34%),
    radial-gradient(42% 24% at 16% 12%, rgba(110,205,250,.2), rgba(110,205,250,0) 70%),
    radial-gradient(50% 28% at 82% 26%, rgba(140,120,255,.14), rgba(140,120,255,0) 72%),
    radial-gradient(36% 22% at 46% 60%, rgba(90,230,180,.1), rgba(90,230,180,0) 74%),
    radial-gradient(110% 60% at 18% -10%, rgba(110,200,245,.24), rgba(110,200,245,0) 55%),
    radial-gradient(90% 55% at 85% -6%, rgba(150,120,255,.16), rgba(150,120,255,0) 60%),
    radial-gradient(120% 60% at 50% 122%, rgba(46,150,110,.4), rgba(46,150,110,0) 62%),
    linear-gradient(180deg, #0a2334 0%, #0d2e45 40%, #10405f 72%, #0e4156 100%);
  --surface: rgba(18,48,70,.6);
  --surface-solid: #10324a;
  --glass: linear-gradient(180deg, rgba(26,62,88,.85), rgba(16,44,66,.72));
  --glass-deep: linear-gradient(180deg, rgba(22,54,78,.68), rgba(14,40,60,.56));
  --ink: #eaf7ff;
  --ink-2: #b3d3e6;
  --muted: #7fa3b9;
  --line: rgba(150,220,255,.24);
  --line-2: rgba(150,220,255,.4);
  --accent: #62c6f2;
  --accent-2: #8fdcff;
  --accent-soft: rgba(80,190,240,.18);
  --ring: rgba(110,200,250,.5);
  --topbar: rgba(12,36,54,.6);
  --sk-a: rgba(120,190,240,.12);
  --sk-b: rgba(160,220,255,.24);
  --candy: linear-gradient(180deg, #66bde7, #2f87b9 60%, #256f9c);
  --candy-text: #f4fbff;
  --shadow-1: 0 12px 26px -14px rgba(0,0,0,.7);
  --shadow-2: 0 24px 50px -22px rgba(0,0,0,.85);
  --glass-hi: rgba(190,235,255,.32);
  --well: rgba(10,34,52,.6);
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color .5s ease, color .4s ease;
}

/* 整张背景（射线 + 云 + 天空 + 草地）放在一个固定层里：
   不再用 background-attachment:fixed（iOS 兼容 + 免重绘），动画只做合成变换 */
body::before {
  content: '';
  position: fixed;
  inset: -12%;
  z-index: -2;
  pointer-events: none;
  background: var(--bg-grad);
  animation: cloudDrift 26s ease-in-out infinite alternate, rayPulse 9s ease-in-out infinite;
}

/* ─── 循环上升的玻璃球（明/暗自适应） ─── */
.bubbles { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bubbles i {
  position: absolute;
  left: var(--x, 50%);
  bottom: -22vh;
  width: var(--s, 22px);
  height: var(--s, 22px);
  border-radius: 50%;
  opacity: var(--o, .5);
  will-change: transform;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.18) 40%, rgba(255,255,255,.03) 62%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.02) 54%, rgba(255,255,255,.4) 86%, rgba(255,255,255,.8) 100%);
  box-shadow:
    inset -5px -7px 14px rgba(255,255,255,.45),
    inset 4px 5px 11px rgba(255,255,255,.35),
    0 2px 16px rgba(150,215,255,.32);
  animation: bubbleRise var(--d, 34s) linear infinite;
  animation-delay: var(--dl, 0s);
}
.bubbles i::after {
  content: '';
  position: absolute;
  right: 20%;
  bottom: 24%;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.85), rgba(255,255,255,0) 74%);
}
:root[data-theme="dark"] .bubbles i {
  background:
    radial-gradient(circle at 32% 26%, rgba(215,245,255,.95) 0 9%, rgba(190,235,255,.16) 40%, rgba(190,235,255,.03) 62%),
    radial-gradient(circle at 50% 50%, rgba(190,235,255,.02) 54%, rgba(190,235,255,.4) 86%, rgba(190,235,255,.82) 100%);
  box-shadow:
    inset -5px -7px 14px rgba(190,235,255,.4),
    inset 4px 5px 11px rgba(190,235,255,.3),
    0 0 26px rgba(110,205,255,.5);
}
/* 大玻璃球（参考图同款，含草地色折射） */
.bubbles i.big {
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.2) 36%, rgba(255,255,255,.03) 58%),
    radial-gradient(60% 38% at 50% 82%, rgba(96,200,130,.5), rgba(96,200,130,0) 70%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.02) 52%, rgba(255,255,255,.42) 86%, rgba(255,255,255,.82) 100%);
}
:root[data-theme="dark"] .bubbles i.big {
  background:
    radial-gradient(circle at 30% 24%, rgba(215,245,255,.9) 0 7%, rgba(190,235,255,.16) 36%, rgba(190,235,255,.03) 58%),
    radial-gradient(60% 38% at 50% 82%, rgba(70,190,140,.35), rgba(70,190,140,0) 70%),
    radial-gradient(circle at 50% 50%, rgba(190,235,255,.02) 52%, rgba(190,235,255,.4) 86%, rgba(190,235,255,.8) 100%);
}
.bubbles i:nth-child(1)  { --x: 4%;  --s: 18px;  --d: 36s; --dl: -6s;  --o: .5; }
.bubbles i:nth-child(2)  { --x: 12%; --s: 46px;  --d: 54s; --dl: -40s; --o: .42; }
.bubbles i:nth-child(3)  { --x: 20%; --s: 12px;  --d: 30s; --dl: -18s; --o: .52; }
.bubbles i:nth-child(4)  { --x: 27%; --s: 120px; --d: 82s; --dl: -66s; --o: .4; }
.bubbles i:nth-child(5)  { --x: 38%; --s: 24px;  --d: 42s; --dl: -12s; --o: .5; }
.bubbles i:nth-child(6)  { --x: 46%; --s: 11px;  --d: 28s; --dl: -24s; --o: .55; }
.bubbles i:nth-child(7)  { --x: 54%; --s: 64px;  --d: 64s; --dl: -50s; --o: .4; }
.bubbles i:nth-child(8)  { --x: 63%; --s: 16px;  --d: 32s; --dl: -3s;  --o: .5; }
.bubbles i:nth-child(9)  { --x: 71%; --s: 92px;  --d: 74s; --dl: -68s; --o: .42; }
.bubbles i:nth-child(10) { --x: 80%; --s: 20px;  --d: 40s; --dl: -28s; --o: .5; }
.bubbles i:nth-child(11) { --x: 88%; --s: 150px; --d: 92s; --dl: -26s; --o: .38; }
.bubbles i:nth-child(12) { --x: 94%; --s: 13px;  --d: 30s; --dl: -16s; --o: .52; }

/* ─── 动效关键词 ─── */
@keyframes rise {
  from { opacity: 0; transform: translateY(16px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes shimmerX {
  from { transform: translateX(-110%); }
  to   { transform: translateX(110%); }
}
@keyframes cloudDrift {
  from { transform: translate3d(-1.4%, 0, 0) scale(1); }
  to   { transform: translate3d(1.8%, 1.4%, 0) scale(1.05); }
}
@keyframes rayPulse {
  0%, 100% { opacity: .85; }
  50%      { opacity: 1; }
}
@keyframes bubbleRise {
  0%   { transform: translate3d(0, 0, 0); }
  12%  { transform: translate3d(12px, -14vh, 0); }
  30%  { transform: translate3d(-14px, -36vh, 0); }
  50%  { transform: translate3d(14px, -60vh, 0); }
  70%  { transform: translate3d(-12px, -84vh, 0); }
  88%  { transform: translate3d(10px, -106vh, 0); }
  100% { transform: translate3d(0, -128vh, 0); }
}
@keyframes shine {
  to { background-position: 200% center; }
}
@keyframes pop {
  0%   { transform: scale(.86); }
  60%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}
@keyframes sheen {
  from { transform: translateX(-160%) skewX(-18deg); }
  to   { transform: translateX(280%) skewX(-18deg); }
}

::selection { background: var(--accent); color: #fff; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 10px; }

::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-radius: 9px; border: 3px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-track { background: transparent; }

/* ─── 顶部阅读进度：流光只做合成位移 ─── */
.progress {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2) 45%, #6fd7a8 80%, var(--accent));
  box-shadow: 0 1px 10px rgba(80,190,240,.65);
  overflow: hidden;
  transform: scaleX(0);
  transform-origin: left;
  z-index: 100;
  will-change: transform;
}
.progress::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 32%, rgba(255,255,255,.6) 50%, transparent 68%);
  animation: shimmerX 3.4s linear infinite;
}

/* ─── 玻璃顶栏 ─── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--topbar);
  backdrop-filter: blur(16px) saturate(1.5);
  -webkit-backdrop-filter: blur(16px) saturate(1.5);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 12px 32px -22px rgba(20,90,140,.55), inset 0 -1px 0 rgba(120,195,240,.22);
}
.topbar-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: .7rem clamp(1rem, 4vw, 2.2rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.brand { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 1.75rem; height: 1.75rem;
  background: var(--candy);
  color: var(--candy-text);
  font-family: var(--serif);
  font-size: .98rem;
  font-weight: 700;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.8);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -3px 6px rgba(20,80,130,.3), 0 6px 14px -6px rgba(30,120,180,.8);
  text-shadow: 0 1px 2px rgba(15,70,110,.45);
  transition: transform .4s var(--ease-spring), filter .3s;
}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.08); filter: brightness(1.06); }
.brand-name {
  font-family: var(--serif);
  font-size: .98rem;
  font-weight: 700;
  letter-spacing: .18em;
}
.topbar-right { display: flex; align-items: center; gap: .9rem; }
.topbar-update {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .04em;
  color: var(--muted);
}
.theme-btn {
  display: grid;
  place-items: center;
  width: 2.1rem; height: 2.1rem;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--glass);
  color: var(--ink-2);
  cursor: pointer;
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-1);
  transition: color .25s ease, border-color .25s ease, transform .45s var(--ease-spring), box-shadow .3s ease;
}
.theme-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  transform: rotate(22deg) scale(1.08);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-1);
}
.theme-btn:active { transform: rotate(22deg) scale(.96); }
.theme-btn svg { width: 1.05rem; height: 1.05rem; transition: transform .45s var(--ease-spring); }
.theme-btn:hover svg { transform: scale(1.08); }
:root[data-theme="dark"] .icon-sun { display: none; }
:root:not([data-theme="dark"]) .icon-moon { display: none; }

.wrap { max-width: 900px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2.2rem); }

/* ─── 报头 ─── */
.masthead { text-align: center; padding: clamp(2rem, 6vw, 3.6rem) 0 1.2rem; }
.masthead-kicker {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .44em;
  text-indent: .44em;
  text-transform: uppercase;
  color: var(--accent);
  animation: rise .8s var(--ease) both;
}
.masthead-title {
  font-family: var(--serif);
  font-size: clamp(2.2rem, 8vw, 4rem);
  font-weight: 700;
  letter-spacing: .14em;
  text-indent: .14em;
  line-height: 1.15;
  margin: .9rem 0 1rem;
  background: linear-gradient(100deg, #14608f 0%, var(--accent) 26%, #45b9e8 46%, #7fd8b6 62%, var(--accent) 82%, #14608f 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rise .8s var(--ease) .08s both, shine 9s linear infinite;
}
:root[data-theme="dark"] .masthead-title {
  background: linear-gradient(100deg, #bfe9ff 0%, var(--accent) 30%, #8ff0cd 52%, #a7dcff 74%, #bfe9ff 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
}
.masthead-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .35rem .85rem;
  color: var(--muted);
  font-size: .8rem;
  animation: rise .8s var(--ease) .16s both;
}
.masthead-meta .sep { color: var(--line-2); }
.rule-double {
  position: relative;
  margin-top: 1.8rem;
  border-top: 2px solid transparent;
  border-image: linear-gradient(90deg, transparent, var(--accent) 22%, var(--accent-2) 50%, var(--accent) 78%, transparent) 1;
  animation: rise .8s var(--ease) .24s both;
}
.rule-double::after {
  content: '';
  position: absolute;
  left: 6%; right: 6%;
  top: 4px;
  border-top: 1px solid var(--line-2);
}

/* ─── 控制区：玻璃面板 ─── */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .8rem 1.2rem;
  margin-top: 1.1rem;
  padding: .85rem 1.05rem;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-hi);
  animation: rise .8s var(--ease) .3s both;
}
.tabs { display: flex; align-items: center; gap: .3rem; }
.tab {
  appearance: none;
  border: 1px solid transparent;
  background: none;
  color: var(--muted);
  font-size: .84rem;
  font-weight: 600;
  letter-spacing: .05em;
  padding: .34rem .8rem;
  border-radius: 999px;
  cursor: pointer;
  transition: color .22s ease, background .25s ease, border-color .25s ease, transform .25s var(--ease-spring), box-shadow .25s ease;
}
.tab:hover { color: var(--ink); background: var(--accent-soft); transform: translateY(-1px); }
.tab:active { transform: translateY(0) scale(.96); }
.tab.is-active {
  color: var(--candy-text);
  background: var(--candy);
  border-color: rgba(255,255,255,.75);
  text-shadow: 0 1px 2px rgba(15,70,110,.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 6px rgba(20,80,130,.28), 0 8px 18px -8px rgba(30,120,180,.8);
  animation: pop .38s var(--ease-spring);
}
.tab em {
  font-style: normal;
  font-family: var(--mono);
  font-size: .66rem;
  color: inherit;
  opacity: .75;
  margin-left: .28rem;
}
.controls-right { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; }

/* 正文字号调节 */
.font-group { display: inline-flex; align-items: center; gap: .3rem; }
.font-btn {
  appearance: none;
  border: 1px solid var(--line);
  border-radius: 999px;

/* ─── 新闻卡片（去 backdrop-filter，靠半透明玻璃渐变维持质感，滚动更顺） ─── */
.feed { display: flex; flex-direction: column; gap: .8rem; padding-bottom: .5rem; }

}
.story:hover {
  transform: translateY(-2px);

}
.story.is-open {

  transform: translateX(-160%) skewX(-18deg);
  opacity: 0;
}
.story-head:hover::after { animation: sheen 1s ease; opacity: 1; }
:root[data-theme="dark"] .story-head::after { background: linear-gradient(100deg, transparent, rgba(190,235,255,.16), transparent); }
.story-head:hover { background: var(--accent-soft); }

}

.story-time { font-size: .72rem; color: var(--muted); }

}

.story-toggle {
  position: relative;
  display: block;
  width: 1.55rem; height: 1.55rem;
  margin-top: .1rem;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  background: var(--well);
  box-shadow: inset 0 1px 0 var(--glass-hi);
  transition: transform .5s var(--ease-spring), border-color .25s ease, background-color .25s ease, box-shadow .3s ease;
}
.story-toggle::before,
.story-toggle::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  background: var(--muted);
  border-radius: 2px;
  transition: background-color .25s ease;
}
.story-toggle::before { width: 8px; height: 1.5px; transform: translate(-50%, -50%); }
.story-toggle::after { width: 1.5px; height: 8px; transform: translate(-50%, -50%); }
.story:hover .story-toggle { border-color: var(--accent); transform: scale(1.08); }
.story.is-open .story-toggle {

}
.story.is-open .story-toggle::before,

.story-body {

.story-body-inner { min-height: 0; overflow: hidden; }
.story-content {

}
.story.is-open .story-content { opacity: 1; transform: none; }

.story-actions { padding: .95rem 1.15rem 1.3rem; }
.source-link {

  font-weight: 600;

.source-link svg { width: .7rem; height: .7rem; transition: transform .35s var(--ease-spring); }
.source-link:hover svg { transform: translate(2px, -2px); }

/* ─── 骨架屏 ─── */
.sk { pointer-events: none; animation: none; }
.sk .story-head:hover { background: none; }
.sk .story-head::after { display: none; }
.sk-line {

/* ─── 空状态 ─── */

  margin-top: 1.4rem;

}
.reset-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.reset-btn:active { transform: translateY(0) scale(.97); }

/* ─── 回到顶部（糖果浮钮） ─── */
.to-top {
  position: fixed;
  right: clamp(1rem, 3vw, 1.6rem);
  bottom: calc(1.5rem + env(safe-area-inset-bottom));

}

.to-top:hover { filter: brightness(1.07); transform: translateY(-3px) scale(1.03); }
.to-top:active { transform: translateY(-1px) scale(.95); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .bubbles { display: none !important; }
}
</style>
</head>

  try {
    var savedFont = Number(localStorage.getItem(FONT_KEY));
    if (savedFont >= 0 && savedFont < FONT_SCALES.length) fontLevel = savedFont;
  } catch (e) {}

  try {
    var savedRead = JSON.parse(localStorage.getItem(READ_KEY) || '[]');
    if (Array.isArray(savedRead)) savedRead.forEach(function (k) { readSet[k] = 1; });
  } catch (e) {}

  function saveRead() {
    try {
      var keys = Object.keys(readSet);
      if (keys.length > 400) keys = keys.slice(keys.length - 400);
      localStorage.setItem(READ_KEY, JSON.stringify(keys));
    } catch (e) {}
  }

  function applyFont() {
    document.documentElement.style.setProperty('--reading-scale', String(FONT_SCALES[fontLevel]));
    if (els.fontDec) els.fontDec.disabled = fontLevel <= 0;
    if (els.fontInc) els.fontInc.disabled = fontLevel >= FONT_SCALES.length - 1;
    try { localStorage.setItem(FONT_KEY, String(fontLevel)); } catch (e) {}
  }

  function createEl(tag, className, parent) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (parent) parent.appendChild(el);
    return el;
  }

  function clearEl(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function fmtDate(dateStr) {
    var parts = String(dateStr || '').split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return dateStr || '';
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return parts[0] + '年' + parts[1] + '月' + parts[2] + '日 · ' + WEEKDAYS[d.getDay()];
  }

  function fmtRelative(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var diff = Date.now() - d.getTime();
    if (diff < 0) diff = 0;
    var minutes = Math.floor(diff / 60000);
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return minutes + ' 分钟前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小时前';
    var days = Math.floor(hours / 24);
    if (days === 1) return '昨天';
    if (days < 7) return days + ' 天前';
    var now = new Date();
    var prefix = d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年';
    return prefix + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function estimateMinutes(item) {
    var text = item.content || item.description || '';
    if (!text) return 0;
    if (item.lang === 'en') {
      var words = text.trim().split(/\s+/).length;
      return Math.max(1, Math.round(words / 220));
    }
    return Math.max(1, Math.round(text.length / 420));
  }

  function normalize(item) {
    return {
      title: item.title || '无标题',
      url: item.url || '',
      source: item.source || '未知来源',
      lang: item.lang === 'en' ? 'en' : 'zh',
      published: item.published || item.date_raw || '',
      description: item.description || item.summary || '',
      content: item.content || ''
    };
  }

  function getTheme() {
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    els.themeBtn.setAttribute('aria-pressed', String(theme === 'dark'));
    els.themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function filteredItems() {
    var q = state.query.trim().toLowerCase();
    return state.items.filter(function (item) {
      if (state.lang !== 'all' && item.lang !== state.lang) return false;
      if (state.source !== 'all' && item.source !== state.source) return false;
      if (!q) return true;
      var haystack = [item.title, item.source, item.description, item.content].join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
  }

  function setOpen(story, open) {
    story.classList.toggle('is-open', open);
    var head = story.querySelector('.story-head');
    if (head) head.setAttribute('aria-expanded', String(open));
  }

  function markRead(story) {
    var key = story.dataset.key;
    if (!key || readSet[key]) return;
    readSet[key] = 1;
    story.classList.add('is-read');
    saveRead();
  }

  function ensureVisible(story) {
    var head = story.querySelector('.story-head');
    if (head && head.getBoundingClientRect().top < 72) {
      head.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  /* J/K 在新闻间前后翻（阅读流） */
  function moveOpen(dir) {
    var items = els.feed.querySelectorAll('.story:not(.sk)');
    if (!items.length) return;
    var idx = openEl ? Array.prototype.indexOf.call(items, openEl) : -1;
    if (idx === -1) {
      idx = items.length - 1;
      for (var i = 0; i < items.length; i++) {
        if (items[i].getBoundingClientRect().top > 80) { idx = i - 1; break; }
      }
    }
    var next = Math.min(items.length - 1, Math.max(0, idx + dir));
    var story = items[next];
    if (story === openEl) { ensureVisible(story); return; }
    if (openEl) setOpen(openEl, false);
    setOpen(story, true);
    openEl = story;
    markRead(story);
    ensureVisible(story);
  }

  function createStory(item, index) {
    var story = createEl('article', 'story');
    story.style.setProperty('--i', String(Math.min(index, 14)));
    story.dataset.key = item.url || item.title;

    var heading = createEl('h2', 'story-heading', story);
    var head = createEl('button', 'story-head', heading);
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    var bodyId = 'story-body-' + index;
    head.setAttribute('aria-controls', bodyId);

    var idx = createEl('span', 'story-index', head);
    idx.textContent = String(index + 1).padStart(2, '0');

    var main = createEl('span', 'story-main', head);

    var meta = createEl('span', 'story-meta', main);
    var source = createEl('span', 'story-source', meta);
    source.textContent = item.source;
    var timeText = fmtRelative(item.published);
    if (timeText) {
      var time = createEl('time', 'story-time', meta);
      time.textContent = timeText;
      if (item.published) time.setAttribute('datetime', item.published);
    }
    var readMinutes = estimateMinutes(item);
    if (readMinutes > 0) {
      createEl('span', 'story-read-time', meta).textContent = '约 ' + readMinutes + ' 分钟';
    }

    var title = createEl('span', 'story-title', main);
    title.textContent = item.title;

    if (item.description) {
      var lead = createEl('span', 'story-lead', main);
      lead.textContent = item.description;
    }

    createEl('span', 'story-toggle', head).setAttribute('aria-hidden', 'true');

    var body = createEl('div', 'story-body', story);
    body.id = bodyId;
    var inner = createEl('div', 'story-body-inner', body);

    var content = createEl('div', 'story-content', inner);
    var fullText = item.content || item.description;
    if (fullText) {
      content.textContent = fullText;
    } else {
      content.classList.add('is-missing');
      content.textContent = '暂未抓取到正文，请前往来源网站阅读。';
    }

    if (item.url) {
      var actions = createEl('div', 'story-actions', inner);
      var link = createEl('a', 'source-link', actions);
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '阅读原文';
      var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      arrow.setAttribute('viewBox', '0 0 12 12');
      arrow.setAttribute('fill', 'none');
      arrow.setAttribute('stroke', 'currentColor');
      arrow.setAttribute('stroke-width', '1.6');
      arrow.setAttribute('stroke-linecap', 'round');
      arrow.setAttribute('aria-hidden', 'true');
      var arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      arrowPath.setAttribute('d', 'M2.5 9.5L9.5 2.5M4 2.5h5.5V8');
      arrow.appendChild(arrowPath);
      link.appendChild(arrow);
    }

    if (readSet[story.dataset.key]) story.classList.add('is-read');

    head.addEventListener('click', function () {
      if (story.classList.contains('is-open')) {
        setOpen(story, false);
        openEl = null;
      } else {
        if (openEl) setOpen(openEl, false);
        setOpen(story, true);
        openEl = story;
        markRead(story);
        ensureVisible(story);
      }
    });

    return story;
  }

  function updateCount(shown) {
    var total = state.items.length;
    if (!total) {
      els.count.textContent = '';
      return;
    }
    els.count.textContent = shown === total ? '共 ' + total + ' 条要闻' : '匹配 ' + shown + ' / ' + total + ' 条';
  }

  function renderEmpty() {
    var box = createEl('div', 'empty', els.feed);
    var mark = createEl('div', 'empty-mark', box);
    mark.textContent = '—';
    var title = createEl('div', 'empty-title', box);
    title.textContent = '没有找到匹配的新闻';
    var text = createEl('div', 'empty-text', box);
    text.textContent = '试试更换关键词、语言或来源。';
    var btn = createEl('button', 'reset-btn', box);
    btn.type = 'button';
    btn.textContent = '重置筛选';
    btn.addEventListener('click', resetFilters);
  }

  function renderError() {
    clearEl(els.feed);
    updateCount(0);
    els.count.textContent = '加载失败';
    var box = createEl('div', 'empty', els.feed);
    var mark = createEl('div', 'empty-mark', box);
    mark.textContent = '!';
    var title = createEl('div', 'empty-title', box);
    title.textContent = '新闻加载失败';
    var text = createEl('div', 'empty-text', box);
    text.textContent = '请检查网络连接后重试。';
    var btn = createEl('button', 'reset-btn', box);
    btn.type = 'button';
    btn.textContent = '重新加载';
    btn.addEventListener('click', load);
  }

  function render() {
    var items = filteredItems();
    openEl = null;
    clearEl(els.feed);
    updateCount(items.length);
    if (!items.length) {
      renderEmpty();
      return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function (item, index) {
      frag.appendChild(createStory(item, index));
    });
    els.feed.appendChild(frag);
  }

  function renderSkeleton() {
    clearEl(els.feed);
    els.count.textContent = '正在加载…';
    els.mastheadDate.textContent = '';
    els.mastheadStats.textContent = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 6; i++) {
      var story = createEl('div', 'story sk', frag);
      var head = createEl('div', 'story-head', story);
      createEl('div', 'sk-line sk-index', head);
      var main = createEl('div', 'story-main', head);
      createEl('div', 'sk-line sk-meta', main);
      createEl('div', 'sk-line sk-title', main);
      createEl('div', 'sk-line sk-lead', main);
    }
    els.feed.appendChild(frag);
  }

  function syncTabs() {
    var tabs = els.tabs.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      var active = tab.dataset.lang === state.lang;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-pressed', String(active));
    });
  }

  function updateTabCounts() {
    var counts = { all: state.items.length, zh: 0, en: 0 };
    state.items.forEach(function (item) { counts[item.lang] += 1; });
    var tabs = els.tabs.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      var em = tab.querySelector('em');
      if (em) em.textContent = String(counts[tab.dataset.lang] || 0);
    });
  }

  function updateSources() {
    var counts = {};
    state.items.forEach(function (item) {
      counts[item.source] = (counts[item.source] || 0) + 1;
    });
    var names = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    clearEl(els.source);
    var all = createEl('option', '', els.source);
    all.value = 'all';
    all.textContent = '全部来源';
    names.forEach(function (name) {
      var opt = createEl('option', '', els.source);
      opt.value = name;
      opt.textContent = name + ' (' + counts[name] + ')';
    });
    els.source.value = 'all';
  }

  function resetFilters() {
    state.lang = 'all';
    state.query = '';
    state.source = 'all';
    els.search.value = '';
    els.source.value = 'all';
    syncTabs();
    render();
  }

  function isTyping(target) {
    if (!target) return false;
    var tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }

  var scrollTicking = false;
  function onScroll() {
    if (scrollTicking) return;
    scrollTicking = true;
    requestAnimationFrame(function () {
      scrollTicking = false;
      var scrollTop = window.scrollY;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var progress = max > 0 ? scrollTop / max : 0;
      els.progress.style.transform = 'scaleX(' + progress + ')';
      var show = scrollTop > 560;
      if (show !== toTopVisible) {
        toTopVisible = show;
        if (els.toTop) els.toTop.classList.toggle('show', show);
      }
    });
  }

  function init(data) {
    state.items = (data.items || []).map(normalize);
    state.lang = 'all';
    state.query = '';
    state.source = 'all';

    els.mastheadDate.textContent = fmtDate(data.date);
    var zh = state.items.filter(function (i) { return i.lang === 'zh'; }).length;
    els.mastheadStats.textContent = '共 ' + state.items.length + ' 条 · 中文 ' + zh + ' · English ' + (state.items.length - zh);

    var generated = data.generated ? new Date(data.generated) : null;
    if (generated && !isNaN(generated.getTime())) {
      var hh = String(generated.getHours()).padStart(2, '0');
      var mm = String(generated.getMinutes()).padStart(2, '0');
      els.topbarUpdate.textContent = '更新于 ' + hh + ':' + mm;
    } else {
      els.topbarUpdate.textContent = '';
    }

    updateTabCounts();
    updateSources();
    syncTabs();
    render();
    onScroll();
  }

  async function load() {
    renderSkeleton();
    els.hint.textContent = '点击条目展开正文 · J/K 切换';
    try {
      var resp = await fetch('news.json', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      init(data);
    } catch (err) {
      renderError();
      console.error(err);
    }
  }

  els.themeBtn.addEventListener('click', function () {
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  });

  els.fontDec.addEventListener('click', function () {
    fontLevel = Math.max(0, fontLevel - 1);
    applyFont();
  });

  els.fontInc.addEventListener('click', function () {
    fontLevel = Math.min(FONT_SCALES.length - 1, fontLevel + 1);
    applyFont();
  });

  els.toTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  els.tabs.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    state.lang = tab.dataset.lang;
    syncTabs();
    render();
  });

  els.search.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = els.search.value;
      render();
    }, 120);
  });

  els.source.addEventListener('change', function () {
    state.source = els.source.value;
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (document.activeElement === els.search && els.search.value) {
        els.search.value = '';
        state.query = '';
        render();
        return;
      }
      if (openEl) {
        setOpen(openEl, false);
        openEl = null;
        return;
      }
    }
    if (isTyping(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      els.search.focus();
      return;
    }
    if (e.key === 'j') { e.preventDefault(); moveOpen(1); return; }
    if (e.key === 'k') { e.preventDefault(); moveOpen(-1); return; }
  });

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });

  applyTheme(getTheme());
  applyFont();
  load();
})();
</script>
</body>
</html>
