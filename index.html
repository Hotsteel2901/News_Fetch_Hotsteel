<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新闻速览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #09090b;
  --muted: #71717a;
  --border: #e4e4e7;
  --accent: #dc2626;
  --accent-bg: #fef2f2;
  --hover-bg: #fafafa;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --radius: 2px;
  --transition: 0.3s ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --fg: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --accent: #ef4444;
    --accent-bg: rgba(239, 68, 68, 0.1);
    --hover-bg: #18181b;
  }
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background var(--transition), color var(--transition);
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem;
}

/* Header */
.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 2.5rem;
}

.brand-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius);
  background: var(--accent);
}

.brand-text {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--muted);
}

/* Hero */
.hero {
  margin-bottom: 3rem;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.6s ease forwards;
}

.hero-date {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--muted);
  margin-bottom: 0.75rem;
}

.hero-title {
  font-size: clamp(2.5rem, 8vw, 4rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 1rem;
}

.hero-summary {
  font-size: 1.05rem;
  color: var(--muted);
  max-width: 480px;
  line-height: 1.6;
}

/* News list */
.news-list {
  border-top: 1px solid var(--border);
}

.news-item {
  border-bottom: 1px solid var(--border);
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.5s ease forwards;
}

.news-item:nth-child(1) { animation-delay: 0.05s; }
.news-item:nth-child(2) { animation-delay: 0.1s; }
.news-item:nth-child(3) { animation-delay: 0.15s; }
.news-item:nth-child(4) { animation-delay: 0.2s; }
.news-item:nth-child(5) { animation-delay: 0.25s; }
.news-item:nth-child(6) { animation-delay: 0.3s; }
.news-item:nth-child(7) { animation-delay: 0.35s; }
.news-item:nth-child(8) { animation-delay: 0.4s; }
.news-item:nth-child(9) { animation-delay: 0.45s; }
.news-item:nth-child(10) { animation-delay: 0.5s; }
.news-item:nth-child(11) { animation-delay: 0.55s; }
.news-item:nth-child(12) { animation-delay: 0.6s; }

.news-header {
  display: grid;
  grid-template-columns: 2.5rem 1fr;
  gap: 1rem;
  align-items: start;
  width: 100%;
  padding: 1.25rem 0;
  background: transparent;
  border: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: padding-left 0.2s ease-out;
}

.news-header:hover,
.news-header:focus-visible {
  padding-left: 0.5rem;
  outline: none;
}

.news-header:focus-visible .news-title {
  color: var(--accent);
}

.news-number {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--muted);
  padding-top: 0.1rem;
  transition: color 0.2s ease;
}

.news-header:hover .news-number,
.news-item.is-open .news-number {
  color: var(--accent);
}

.news-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.35rem;
}

.news-source {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
}

.news-category {
  font-size: 0.75rem;
  color: var(--muted);
}

.news-title {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin-bottom: 0.3rem;
  transition: color 0.2s ease;
}

.news-header:hover .news-title {
  color: var(--accent);
}

.news-summary {
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.5;
}

/* Expandable content */
.news-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.3s ease-out;
}

.news-item.is-open .news-body {
  grid-template-rows: 1fr;
}

.news-body-inner {
  min-height: 0;
  overflow: hidden;
}

.news-content {
  position: relative;
  padding: 0 0 1.5rem 3.5rem;
  font-size: 0.95rem;
  line-height: 1.75;
  color: var(--fg);
  white-space: pre-wrap;
}

.news-content:empty::before {
  content: '正文加载失败或暂不可用。';
  color: var(--muted);
}

.news-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 1.25rem;
  cursor: pointer;
  border-radius: 50%;
  transition: color 0.2s ease, background 0.2s ease;
}

.news-close:hover,
.news-close:focus-visible {
  color: var(--fg);
  background: var(--hover-bg);
  outline: none;
}

.content-fallback {
  color: var(--muted);
  font-size: 0.875rem;
}

.content-fallback a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 0.15em;
}

/* States */
.state-message {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--muted);
  font-size: 1rem;
}

.state-message a {
  color: var(--accent);
}

/* Skeleton */
.skeleton .news-header {
  pointer-events: none;
  cursor: default;
}

.skeleton .news-header:hover {
  padding-left: 0;
}

.skeleton .news-number,
.skeleton .news-source,
.skeleton .news-title,
.skeleton .news-summary {
  background: var(--border);
  border-radius: 4px;
  color: transparent;
}

.skeleton .news-number { width: 1.5rem; height: 1rem; }
.skeleton .news-source { width: 60px; height: 0.7rem; }
.skeleton .news-title { width: 80%; height: 1.1rem; margin-bottom: 0.5rem; }
.skeleton .news-summary { width: 95%; height: 0.85rem; }

/* Footer */
.footer {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .hero,
  .news-item {
    animation: none;
    opacity: 1;
    transform: none;
  }
  .news-body {
    transition: none;
  }
}

@media (max-width: 480px) {
  .news-header {
    grid-template-columns: 2rem 1fr;
    gap: 0.75rem;
  }
  .news-content {
    padding-left: 2.75rem;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <span class="brand-text">Daily Brief</span>
  </div>

  <header class="hero" id="hero">
    <div class="hero-date" id="hero-date"></div>
    <h1 class="hero-title">每日新闻<br>速览</h1>
    <p class="hero-summary" id="hero-summary"></p>
  </header>

  <div class="news-list" id="news-list"></div>

  <footer class="footer">自动生成 · 每日 UTC+8 零点更新 · Powered by DeepSeek</footer>
</div>

<script>
const EL = {
  heroDate: document.getElementById('hero-date'),
  heroSummary: document.getElementById('hero-summary'),
  list: document.getElementById('news-list'),
};

const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

let openItem = null;

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const wd = WEEKDAYS[d.getDay()];
  return `${y}年${m}月${day}日 · ${wd}`;
}

function setText(el, text) {
  el.textContent = text;
}

function clearEl(el) {
  while (el.firstChild) {
    el.removeChild(el.firstChild);
  }
}

function createEl(tag, className, parent) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (parent) parent.appendChild(el);
  return el;
}

function renderSkeleton() {
  EL.heroDate.textContent = '';
  EL.heroSummary.textContent = '';
  EL.list.classList.add('skeleton');

  for (let i = 0; i < 6; i++) {
    const item = createEl('div', 'news-item', EL.list);
    const header = createEl('button', 'news-header', item);
    createEl('div', 'news-number', header);
    const body = createEl('div', 'news-body-col', header);
    createEl('div', 'news-source', body);
    createEl('div', 'news-title', body);
    createEl('div', 'news-summary', body);
  }
}

function closeAll() {
  if (openItem) {
    openItem.classList.remove('is-open');
    openItem = null;
  }
}

function toggleItem(item) {
  if (item.classList.contains('is-open')) {
    item.classList.remove('is-open');
    openItem = null;
    return;
  }
  closeAll();
  item.classList.add('is-open');
  openItem = item;
}

function createNewsItem(item, index) {
  const wrap = createEl('article', 'news-item');
  wrap.dataset.url = item.url || '';

  const header = createEl('button', 'news-header', wrap);
  header.setAttribute('aria-expanded', 'false');

  const number = createEl('div', 'news-number', header);
  setText(number, String(index + 1).padStart(2, '0'));

  const col = createEl('div', 'news-body-col', header);

  const meta = createEl('div', 'news-meta', col);
  const source = createEl('span', 'news-source', meta);
  setText(source, item.source || '未知来源');
  if (item.category) {
    const category = createEl('span', 'news-category', meta);
    setText(category, item.category);
  }

  const title = createEl('h2', 'news-title', col);
  setText(title, item.title || '无标题');

  const summary = createEl('p', 'news-summary', col);
  setText(summary, item.summary || '');

  const body = createEl('div', 'news-body', wrap);
  const inner = createEl('div', 'news-body-inner', body);
  const content = createEl('div', 'news-content', inner);

  const closeBtn = createEl('button', 'news-close', content);
  closeBtn.setAttribute('aria-label', '关闭');
  setText(closeBtn, '×');

  const textEl = createEl('div', 'news-content-text', content);

  if (item.content) {
    setText(textEl, item.content);
  } else {
    const fallback = createEl('p', 'content-fallback', textEl);
    setText(fallback, '正文暂无法在此展示，可查看原始链接：');
    const link = createEl('a', '', fallback);
    link.href = item.url || '#';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    setText(link, item.url || '');
  }

  header.addEventListener('click', () => {
    toggleItem(wrap);
    header.setAttribute('aria-expanded', String(wrap.classList.contains('is-open')));
  });

  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeAll();
    header.setAttribute('aria-expanded', 'false');
  });

  return wrap;
}

function render(data) {
  EL.list.classList.remove('skeleton');
  clearEl(EL.list);

  const date = data.date || '';
  setText(EL.heroDate, fmtDate(date));

  let summary = data.summary || '';
  if (!summary && (data.total || 0) > 0) {
    summary = `今日精选 ${data.total} 条要闻`;
  }
  setText(EL.heroSummary, summary);

  const items = data.items || [];
  if (items.length === 0) {
    const msg = createEl('div', 'state-message', EL.list);
    setText(msg, '今日暂无新闻更新，请稍后再来');
    return;
  }

  items.forEach((item, index) => {
    EL.list.appendChild(createNewsItem(item, index));
  });
}

function showError(msg) {
  EL.list.classList.remove('skeleton');
  clearEl(EL.list);
  const wrap = createEl('div', 'state-message', EL.list);
  setText(wrap, msg);
  const br = createEl('br', '', wrap);
  const br2 = createEl('br', '', wrap);
  const retry = createEl('a', '', wrap);
  retry.href = 'javascript:location.reload()';
  setText(retry, '点击重试');
}

async function load() {
  renderSkeleton();
  try {
    const resp = await fetch('news.json');
    if (!resp.ok) throw new Error(`加载失败 (${resp.status})`);
    const data = await resp.json();
    render(data);
  } catch (e) {
    showError('新闻加载失败，请检查网络后重试');
    console.error(e);
  }
}

load();
</script>
</body>
</html>
