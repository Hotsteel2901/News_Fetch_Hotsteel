<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="每日新闻速览：自动抓取中英文 RSS 新闻源，聚合阅读，每日更新。">
<title>每日新闻速览</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem('daily-news-theme');
    if (saved !== 'light' && saved !== 'dark') {
      saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = saved;
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: light;
  --paper: #f4f2ed;
  --surface: #fffdf8;
  --ink: #17140f;
  --ink-2: #47413a;
  --muted: #7d766b;
  --line: #ddd7ca;
  --line-2: #c8c1b1;
  --accent: #b3261e;
  --accent-soft: rgba(179, 38, 30, .07);
  --ring: rgba(179, 38, 30, .3);
  --topbar: rgba(244, 242, 237, .87);
  --sk-a: #e5e0d4;
  --sk-b: #f2eee5;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f0e0c;
  --surface: #171512;
  --ink: #f1eee6;
  --ink-2: #cbc5b9;
  --muted: #918a7d;
  --line: #2a2823;
  --line-2: #3c3932;
  --accent: #e5544b;
  --accent-soft: rgba(229, 84, 75, .1);
  --ring: rgba(229, 84, 75, .38);
  --topbar: rgba(15, 14, 12, .87);
  --sk-a: #201e1a;
  --sk-b: #2c2924;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(1100px 460px at 50% -260px, var(--accent-soft), transparent 70%);
  pointer-events: none;
  z-index: -1;
}

::selection { background: var(--accent); color: #fff; }

a { color: inherit; }

button { font-family: inherit; }

:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  z-index: 100;
  will-change: transform;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--topbar);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: .7rem clamp(1rem, 4vw, 2.2rem);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 1.65rem;
  height: 1.65rem;
  background: var(--accent);
  color: #fff;
  font-family: var(--serif);
  font-size: .95rem;
  font-weight: 700;
  border-radius: 2px;
}

.brand-name {
  font-family: var(--serif);
  font-size: .95rem;
  font-weight: 700;
  letter-spacing: .18em;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: .9rem;
}

.topbar-update {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .04em;
  color: var(--muted);
}

.theme-btn {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease, transform .25s var(--ease);
}

.theme-btn:hover { color: var(--accent); border-color: var(--accent); transform: rotate(15deg); }

.theme-btn svg { width: 1rem; height: 1rem; }

:root[data-theme="dark"] .icon-sun { display: none; }
:root:not([data-theme="dark"]) .icon-moon { display: none; }

.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 4vw, 2.2rem);
}

.masthead {
  text-align: center;
  padding: clamp(2rem, 6vw, 3.6rem) 0 1.2rem;
}

.masthead-kicker {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .44em;
  text-indent: .44em;
  text-transform: uppercase;
  color: var(--accent);
}

.masthead-title {
  font-family: var(--serif);
  font-size: clamp(2.2rem, 8vw, 4.1rem);
  font-weight: 700;
  letter-spacing: .14em;
  text-indent: .14em;
  line-height: 1.15;
  margin: .9rem 0 1rem;
}

.masthead-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .35rem .85rem;
  color: var(--muted);
  font-size: .8rem;
}

.masthead-meta .sep { color: var(--line-2); }

.rule-double {
  position: relative;
  margin-top: 1.8rem;
  border-top: 2px solid var(--ink);
}

.rule-double::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 4px;
  border-top: 1px solid var(--line-2);
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .9rem 1.2rem;
  padding: 1rem 0 .9rem;
}

.tabs { display: flex; align-items: center; gap: .15rem; }

.tab {
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--muted);
  font-size: .84rem;
  font-weight: 600;
  letter-spacing: .05em;
  padding: .3rem .5rem;
  cursor: pointer;
  transition: color .2s ease, border-color .2s ease;
}

.tab:hover { color: var(--ink); }

.tab.is-active { color: var(--ink); border-bottom-color: var(--accent); }

.tab em {
  font-style: normal;
  font-family: var(--mono);
  font-size: .66rem;
  color: var(--muted);
  margin-left: .28rem;
}

.controls-right {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.search {
  display: flex;
  align-items: center;
  gap: .45rem;
  border-bottom: 1px solid var(--line-2);
  padding: .25rem 0;
  transition: border-color .2s ease;
}

.search:focus-within { border-color: var(--accent); }

.search svg { width: .85rem; height: .85rem; color: var(--muted); flex: none; }

.search input {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-size: .84rem;
  width: 11rem;
  padding: 0;
}

.search input::placeholder { color: var(--muted); }

.source-wrap { position: relative; }

.source-wrap select {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  color: var(--ink-2);
  font-size: .78rem;
  padding: .4rem 1.7rem .4rem .75rem;
  cursor: pointer;
  transition: border-color .2s ease, color .2s ease;
}

.source-wrap select:hover,
.source-wrap select:focus { border-color: var(--accent); color: var(--ink); outline: none; }

.source-wrap::after {
  content: '';
  position: absolute;
  right: .72rem;
  top: 50%;
  width: .4rem;
  height: .4rem;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

.feed-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: .1rem 0 .6rem;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .06em;
  color: var(--muted);
}

.feed { border-bottom: 1px solid var(--line); }

.story {
  border-bottom: 1px solid var(--line);
  animation: rise .55s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 30ms);
}

.story:last-child { border-bottom: 0; }

.story-heading { font-size: inherit; font-weight: inherit; }

.story-head {
  position: relative;
  display: grid;
  grid-template-columns: 2.1rem 1fr 1.4rem;
  gap: 1rem;
  align-items: start;
  width: 100%;
  padding: 1.55rem .25rem;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color .25s ease;
}

.story-head:hover { background: var(--surface); }

.story-head:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }

.story.is-open .story-head { background: var(--accent-soft); }

.story-index {
  display: block;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .08em;
  color: var(--muted);
  padding-top: .32rem;
  transition: color .25s ease;
}

.story-main { display: block; min-width: 0; }

.story-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .4rem;
}

.story-source {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
}

.story-time { font-size: .72rem; color: var(--muted); }

.story-time:not(:empty)::before { content: '·'; margin-right: .5rem; color: var(--line-2); }

.story-title {
  display: block;
  font-family: var(--serif);
  font-size: clamp(1.12rem, 2.2vw, 1.4rem);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: .01em;
  margin-bottom: .45rem;
  transition: color .25s ease;
}

.story-head:hover .story-title,
.story.is-open .story-title { color: var(--accent); }

.story-lead {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--ink-2);
  font-size: .9rem;
  line-height: 1.7;
}

.story.is-open .story-lead { display: none; }

.story-toggle {
  position: relative;
  display: block;
  width: 1.4rem;
  height: 1.4rem;
  margin-top: .15rem;
  border: 1px solid var(--line-2);
  border-radius: 50%;
  transition: transform .4s var(--ease), border-color .25s ease, background-color .25s ease;
}

.story-toggle::before,
.story-toggle::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  background: var(--muted);
  transition: background-color .25s ease;
}

.story-toggle::before { width: 8px; height: 1.5px; transform: translate(-50%, -50%); }

.story-toggle::after { width: 1.5px; height: 8px; transform: translate(-50%, -50%); }

.story.is-open .story-toggle {
  transform: rotate(135deg);
  border-color: var(--accent);
  background: var(--accent-soft);
}

.story.is-open .story-toggle::before,
.story.is-open .story-toggle::after { background: var(--accent); }

.story-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .5s var(--ease);
}

.story.is-open .story-body { grid-template-rows: 1fr; }

.story-body-inner { min-height: 0; overflow: hidden; }

.story-content {
  max-width: 70ch;
  padding: .15rem 1.4rem 1.1rem 3.35rem;
  color: var(--ink-2);
  font-size: .95rem;
  line-height: 1.95;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity .4s ease .08s, transform .4s ease .08s;
}

.story.is-open .story-content { opacity: 1; transform: none; }

.story-content.is-missing { color: var(--muted); font-size: .88rem; font-style: italic; }

.story-actions { padding: 0 1.4rem 1.6rem 3.35rem; }

.source-link {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  color: var(--accent);
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .05em;
  text-decoration: none;
  padding-bottom: 2px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}

.source-link:hover,
.source-link:focus-visible { border-bottom-color: var(--accent); }

.source-link svg { width: .7rem; height: .7rem; }

.sk { pointer-events: none; animation: none; }

.sk .story-head:hover { background: none; }

.sk-line {
  border-radius: 3px;
  background: linear-gradient(90deg, var(--sk-a) 25%, var(--sk-b) 50%, var(--sk-a) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}

.sk-index { width: 1.2rem; height: .7rem; margin-top: .35rem; }
.sk-meta { width: 5rem; height: .62rem; margin-bottom: .75rem; }
.sk-title { width: 82%; height: 1.05rem; margin-bottom: .7rem; }
.sk-lead { width: 95%; height: .8rem; }

.empty {
  text-align: center;
  padding: clamp(3rem, 10vw, 5.5rem) 1rem;
}

.empty-mark {
  font-family: var(--serif);
  font-size: 1.8rem;
  color: var(--accent);
  margin-bottom: .5rem;
}

.empty-title {
  font-family: var(--serif);
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: .4rem;
}

.empty-text { color: var(--muted); font-size: .86rem; }

.reset-btn {
  appearance: none;
  margin-top: 1.4rem;
  padding: .5rem 1.15rem;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .2s ease, color .2s ease;
}

.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

.footer {
  padding: 2.4rem 0 4.5rem;
  text-align: center;
}

.footer-rule { width: 3rem; height: 2px; background: var(--accent); margin: 0 auto 1.4rem; }

.footer p { color: var(--muted); font-size: .78rem; line-height: 1.9; }

.footer-dim { opacity: .72; font-size: .72rem; margin-top: .15rem; }

@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (max-width: 640px) {
  .controls { flex-direction: column; align-items: stretch; }
  .controls-right { justify-content: space-between; }
  .search { flex: 1; }
  .search input { width: 100%; }
  .topbar-update { display: none; }
  .masthead-title { letter-spacing: .1em; text-indent: .1em; }
  .story-head { grid-template-columns: 1.7rem 1fr 1.2rem; gap: .7rem; padding: 1.3rem 0; }
  .story-lead { -webkit-line-clamp: 3; }
  .story-content { padding: .1rem .4rem 1rem 2.4rem; font-size: .92rem; line-height: 1.9; }
  .story-actions { padding: 0 .4rem 1.4rem 2.4rem; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">聞</span>
      <span class="brand-name">每日速览</span>
    </a>
    <div class="topbar-right">
      <span class="topbar-update" id="topbar-update"></span>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="切换深色主题" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.8 13.2A8.6 8.6 0 1 1 10.8 3.2a6.8 6.8 0 0 0 10 10z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="masthead">
    <p class="masthead-kicker">Daily News Digest</p>
    <h1 class="masthead-title">每日新闻速览</h1>
    <div class="masthead-meta">
      <span id="masthead-date"></span>
      <span class="sep" aria-hidden="true">/</span>
      <span id="masthead-stats"></span>
    </div>
    <div class="rule-double" aria-hidden="true"></div>
  </section>

  <section class="controls" aria-label="筛选新闻">
    <div class="tabs" id="lang-tabs" role="group" aria-label="按语言筛选">
      <button type="button" class="tab is-active" data-lang="all" aria-pressed="true">全部<em></em></button>
      <button type="button" class="tab" data-lang="zh" aria-pressed="false">中文<em></em></button>
      <button type="button" class="tab" data-lang="en" aria-pressed="false">English<em></em></button>
    </div>
    <div class="controls-right">
      <label class="search" for="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="9" cy="9" r="6"></circle>
          <path d="M13.4 13.4L18 18" stroke-linecap="round"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索标题、摘要或正文" autocomplete="off" spellcheck="false">
      </label>
      <span class="source-wrap">
        <select id="source-select" aria-label="按来源筛选"></select>
      </span>
    </div>
  </section>

  <div class="feed-meta">
    <span id="result-count" aria-live="polite"></span>
    <span id="feed-hint">点击条目展开正文</span>
  </div>

  <section class="feed" id="feed" aria-label="新闻列表"></section>

  <footer class="footer">
    <div class="footer-rule" aria-hidden="true"></div>
    <p>由公开 RSS 新闻源自动抓取 · 每日 UTC+8 00:00 更新</p>
    <p class="footer-dim">内容版权归原媒体所有，详细报道请前往来源网站阅读</p>
  </footer>
</main>

<noscript>
  <div class="wrap">
    <div class="empty">
      <p class="empty-text">本页面需要启用 JavaScript 才能加载新闻内容。</p>
    </div>
  </div>
</noscript>

<script>
(function () {
  'use strict';

  var els = {
    progress: document.getElementById('progress'),
    topbarUpdate: document.getElementById('topbar-update'),
    themeBtn: document.getElementById('theme-btn'),
    mastheadDate: document.getElementById('masthead-date'),
    mastheadStats: document.getElementById('masthead-stats'),
    tabs: document.getElementById('lang-tabs'),
    search: document.getElementById('search'),
    source: document.getElementById('source-select'),
    count: document.getElementById('result-count'),
    hint: document.getElementById('feed-hint'),
    feed: document.getElementById('feed')
  };

  var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  var THEME_KEY = 'daily-news-theme';
  var state = { items: [], lang: 'all', query: '', source: 'all' };
  var openEl = null;
  var searchTimer = null;

  function createEl(tag, className, parent) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (parent) parent.appendChild(el);
    return el;
  }

  function clearEl(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function fmtDate(dateStr) {
    var parts = String(dateStr || '').split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return dateStr || '';
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return parts[0] + '年' + parts[1] + '月' + parts[2] + '日 · ' + WEEKDAYS[d.getDay()];
  }

  function fmtRelative(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var diff = Date.now() - d.getTime();
    if (diff < 0) diff = 0;
    var minutes = Math.floor(diff / 60000);
    if (minutes < 1) return '刚刚';
    if (minutes < 60) return minutes + ' 分钟前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小时前';
    var days = Math.floor(hours / 24);
    if (days === 1) return '昨天';
    if (days < 7) return days + ' 天前';
    var now = new Date();
    var prefix = d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年';
    return prefix + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function normalize(item) {
    return {
      title: item.title || '无标题',
      url: item.url || '',
      source: item.source || '未知来源',
      lang: item.lang === 'en' ? 'en' : 'zh',
      published: item.published || item.date_raw || '',
      description: item.description || item.summary || '',
      content: item.content || ''
    };
  }

  function getTheme() {
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    els.themeBtn.setAttribute('aria-pressed', String(theme === 'dark'));
    els.themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  }

  function filteredItems() {
    var q = state.query.trim().toLowerCase();
    return state.items.filter(function (item) {
      if (state.lang !== 'all' && item.lang !== state.lang) return false;
      if (state.source !== 'all' && item.source !== state.source) return false;
      if (!q) return true;
      var haystack = [item.title, item.source, item.description, item.content].join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
  }

  function setOpen(story, open) {
    story.classList.toggle('is-open', open);
    var head = story.querySelector('.story-head');
    if (head) head.setAttribute('aria-expanded', String(open));
  }

  function createStory(item, index) {
    var story = createEl('article', 'story');
    story.style.setProperty('--i', String(Math.min(index, 14)));
    story.dataset.key = item.url || item.title;

    var heading = createEl('h2', 'story-heading', story);
    var head = createEl('button', 'story-head', heading);
    head.type = 'button';
    head.setAttribute('aria-expanded', 'false');
    var bodyId = 'story-body-' + index;
    head.setAttribute('aria-controls', bodyId);

    var idx = createEl('span', 'story-index', head);
    idx.textContent = String(index + 1).padStart(2, '0');

    var main = createEl('span', 'story-main', head);

    var meta = createEl('span', 'story-meta', main);
    var source = createEl('span', 'story-source', meta);
    source.textContent = item.source;
    var timeText = fmtRelative(item.published);
    if (timeText) {
      var time = createEl('time', 'story-time', meta);
      time.textContent = timeText;
      if (item.published) time.setAttribute('datetime', item.published);
    }

    var title = createEl('span', 'story-title', main);
    title.textContent = item.title;

    if (item.description) {
      var lead = createEl('span', 'story-lead', main);
      lead.textContent = item.description;
    }

    createEl('span', 'story-toggle', head).setAttribute('aria-hidden', 'true');

    var body = createEl('div', 'story-body', story);
    body.id = bodyId;
    var inner = createEl('div', 'story-body-inner', body);

    var content = createEl('div', 'story-content', inner);
    var fullText = item.content || item.description;
    if (fullText) {
      content.textContent = fullText;
    } else {
      content.classList.add('is-missing');
      content.textContent = '暂未抓取到正文，请前往来源网站阅读。';
    }

    if (item.url) {
      var actions = createEl('div', 'story-actions', inner);
      var link = createEl('a', 'source-link', actions);
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '阅读原文';
      var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      arrow.setAttribute('viewBox', '0 0 12 12');
      arrow.setAttribute('fill', 'none');
      arrow.setAttribute('stroke', 'currentColor');
      arrow.setAttribute('stroke-width', '1.6');
      arrow.setAttribute('stroke-linecap', 'round');
      arrow.setAttribute('aria-hidden', 'true');
      var arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      arrowPath.setAttribute('d', 'M2.5 9.5L9.5 2.5M4 2.5h5.5V8');
      arrow.appendChild(arrowPath);
      link.appendChild(arrow);
    }

    head.addEventListener('click', function () {
      if (story.classList.contains('is-open')) {
        setOpen(story, false);
        openEl = null;
      } else {
        if (openEl) setOpen(openEl, false);
        setOpen(story, true);
        openEl = story;
      }
    });

    return story;
  }

  function updateCount(shown) {
    var total = state.items.length;
    if (!total) {
      els.count.textContent = '';
      return;
    }
    els.count.textContent = shown === total ? '共 ' + total + ' 条要闻' : '匹配 ' + shown + ' / ' + total + ' 条';
  }

  function renderEmpty() {
    var box = createEl('div', 'empty', els.feed);
    var mark = createEl('div', 'empty-mark', box);
    mark.textContent = '—';
    var title = createEl('div', 'empty-title', box);
    title.textContent = '没有找到匹配的新闻';
    var text = createEl('div', 'empty-text', box);
    text.textContent = '试试更换关键词、语言或来源。';
    var btn = createEl('button', 'reset-btn', box);
    btn.type = 'button';
    btn.textContent = '重置筛选';
    btn.addEventListener('click', resetFilters);
  }

  function renderError() {
    clearEl(els.feed);
    updateCount(0);
    els.count.textContent = '加载失败';
    var box = createEl('div', 'empty', els.feed);
    var mark = createEl('div', 'empty-mark', box);
    mark.textContent = '!';
    var title = createEl('div', 'empty-title', box);
    title.textContent = '新闻加载失败';
    var text = createEl('div', 'empty-text', box);
    text.textContent = '请检查网络连接后重试。';
    var btn = createEl('button', 'reset-btn', box);
    btn.type = 'button';
    btn.textContent = '重新加载';
    btn.addEventListener('click', load);
  }

  function render() {
    var items = filteredItems();
    openEl = null;
    clearEl(els.feed);
    updateCount(items.length);
    if (!items.length) {
      renderEmpty();
      return;
    }
    var frag = document.createDocumentFragment();
    items.forEach(function (item, index) {
      frag.appendChild(createStory(item, index));
    });
    els.feed.appendChild(frag);
  }

  function renderSkeleton() {
    clearEl(els.feed);
    els.count.textContent = '正在加载…';
    els.mastheadDate.textContent = '';
    els.mastheadStats.textContent = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 6; i++) {
      var story = createEl('div', 'story sk', frag);
      var head = createEl('div', 'story-head', story);
      createEl('div', 'sk-line sk-index', head);
      var main = createEl('div', 'story-main', head);
      createEl('div', 'sk-line sk-meta', main);
      createEl('div', 'sk-line sk-title', main);
      createEl('div', 'sk-line sk-lead', main);
    }
    els.feed.appendChild(frag);
  }

  function syncTabs() {
    var tabs = els.tabs.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      var active = tab.dataset.lang === state.lang;
      tab.classList.toggle('is-active', active);
      tab.setAttribute('aria-pressed', String(active));
    });
  }

  function updateTabCounts() {
    var counts = { all: state.items.length, zh: 0, en: 0 };
    state.items.forEach(function (item) { counts[item.lang] += 1; });
    var tabs = els.tabs.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      var em = tab.querySelector('em');
      if (em) em.textContent = String(counts[tab.dataset.lang] || 0);
    });
  }

  function updateSources() {
    var counts = {};
    state.items.forEach(function (item) {
      counts[item.source] = (counts[item.source] || 0) + 1;
    });
    var names = Object.keys(counts).sort(function (a, b) {
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    clearEl(els.source);
    var all = createEl('option', '', els.source);
    all.value = 'all';
    all.textContent = '全部来源';
    names.forEach(function (name) {
      var opt = createEl('option', '', els.source);
      opt.value = name;
      opt.textContent = name + ' (' + counts[name] + ')';
    });
    els.source.value = 'all';
  }

  function resetFilters() {
    state.lang = 'all';
    state.query = '';
    state.source = 'all';
    els.search.value = '';
    els.source.value = 'all';
    syncTabs();
    render();
  }

  function isTyping(target) {
    if (!target) return false;
    var tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }

  function onScroll() {
    var scrollTop = window.scrollY;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var progress = max > 0 ? scrollTop / max : 0;
    els.progress.style.transform = 'scaleX(' + progress + ')';
  }

  function init(data) {
    state.items = (data.items || []).map(normalize);
    state.lang = 'all';
    state.query = '';
    state.source = 'all';

    els.mastheadDate.textContent = fmtDate(data.date);
    var zh = state.items.filter(function (i) { return i.lang === 'zh'; }).length;
    els.mastheadStats.textContent = '共 ' + state.items.length + ' 条 · 中文 ' + zh + ' · English ' + (state.items.length - zh);

    var generated = data.generated ? new Date(data.generated) : null;
    if (generated && !isNaN(generated.getTime())) {
      var hh = String(generated.getHours()).padStart(2, '0');
      var mm = String(generated.getMinutes()).padStart(2, '0');
      els.topbarUpdate.textContent = '更新于 ' + hh + ':' + mm;
    } else {
      els.topbarUpdate.textContent = '';
    }

    updateTabCounts();
    updateSources();
    syncTabs();
    render();
    onScroll();
  }

  async function load() {
    renderSkeleton();
    els.hint.textContent = '点击条目展开正文';
    try {
      var resp = await fetch('news.json', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      init(data);
    } catch (err) {
      renderError();
      console.error(err);
    }
  }

  els.themeBtn.addEventListener('click', function () {
    applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
  });

  els.tabs.addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    state.lang = tab.dataset.lang;
    syncTabs();
    render();
  });

  els.search.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.query = els.search.value;
      render();
    }, 120);
  });

  els.source.addEventListener('change', function () {
    state.source = els.source.value;
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openEl) {
      setOpen(openEl, false);
      openEl = null;
      return;
    }
    if (e.key === '/' && !isTyping(e.target)) {
      e.preventDefault();
      els.search.focus();
    }
  });

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });

  applyTheme(getTheme());
  load();
})();
</script>
</body>
</html>
